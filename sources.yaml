# Generato dall'app Torino Events
sources:
  # I feed RSS di categoria di Citynews rispondono 403 (disattivati lato
  # server: anche /rss/cronaca dà 403). Restano le card della pagina /eventi/.
  - id: torinotoday_eventi
    name: 'TorinoToday — Eventi'
    type: html_torinotoday
    url: 'https://www.torinotoday.it/eventi/'
    default_category: eventi
    enabled: true
  # Copriva /rss/tempo-libero, ora 403. La pagina /eventi/ include già questi
  # contenuti, quindi la fonte è ridondante.
  - id: torinotoday_tempolibero
    name: 'TorinoToday — Tempo Libero'
    type: html_torinotoday
    url: 'https://www.torinotoday.it/eventi/'
    default_category: eventi
    enabled: false
  - id: guidatorino
    name: 'GuidaTorino'
    type: rss
    url: 'https://www.guidatorino.com/feed/'
    default_category: eventi
    enabled: true
  - id: mole24
    name: 'Mole24'
    type: rss
    url: 'https://www.mole24.it/feed/'
    default_category: eventi
    enabled: false
  # Il vecchio feed su comune.torino.it è morto (redirect alla home). Il nuovo
  # torinogiovani.it/rss.xml esiste ma pubblica soprattutto offerte di lavoro
  # ("X cerca personale"), non eventi: come fonte eventi inquinerebbe l'app.
  - id: torinogiovani
    name: 'TorinoGiovani (Comune di Torino)'
    type: rss
    url: 'https://www.torinogiovani.it/rss.xml'
    default_category: eventi
    enabled: false
  - id: guidatorino_eventi_html
    name: 'GuidaTorino — pagina eventi (HTML)'
    type: html_guidatorino
    url: 'https://www.guidatorino.com/eventi-torino/'
    default_category: eventi
    enabled: true
  - id: residentadvisor
    name: 'Resident Advisor — Torino'
    type: todo
    url: 'https://ra.co/events/it/torino'
    default_category: club
    enabled: true
  - id: dice
    name: 'DICE — Torino'
    type: todo
    url: 'https://dice.fm/browse/torino'
    default_category: concerti
    enabled: true
  # /feed/ restituisce HTML (feed WordPress disattivato): si parsa la pagina.
  - id: bunker
    name: 'Bunker'
    type: html_bunker
    url: 'https://variantebunker.com/eventi-in-programma/'
    default_category: eventi
    enabled: true
  # L'Open Event API non è più pubblica (404/401): si legge il JSON-LD
  # schema.org/Event della pagina città.
  - id: xceed
    name: 'XCEED'
    type: xceed
    url: 'https://xceed.me/it/torino/events'
    default_category: club
    enabled: true
  - id: gancio_cisti
    name: 'Gancio Cisti'
    type: gancio
    url: 'https://gancio.cisti.org/feed/rss'
    default_category: centri_sociali
    enabled: true
  - id: off_topic
    name: 'OFF TOPIC'
    type: rss
    url: 'https://offtopictorino.it/eventi/feed/rss'
    default_category: eventi
    enabled: true
